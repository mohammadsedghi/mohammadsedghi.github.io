<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود به سایت محمد</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fa;
      color: #223;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 20px;
      color: #2c3e50;
      font-size: 24px;
    }

    p {
      line-height: 1.8;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .btn {
      display: inline-block;
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn:hover {
      background: #0056b3;
    }

    .error-msg {
      color: red;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    /* این بخش در ابتدا مخفی است و بعد از ورود موفق نشان داده می‌شود */
    #welcome-section {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- بخش فرم ورود -->
    <div id="login-section">
      <h1>ورود به پنل کاربری</h1>
      
      <div class="form-group">
        <label for="username">نام کاربری:</label>
        <input type="text" id="username" placeholder="نام کاربری را وارد کنید">
      </div>
      
      <div class="form-group">
        <label for="password">رمز عبور:</label>
        <input type="password" id="password" placeholder="رمز عبور را وارد کنید">
      </div>
      
      <button class="btn" onclick="checkLogin()">ورود</button>
      <div id="error-message" class="error-msg">نام کاربری یا رمز عبور اشتباه است!</div>
    </div>

    <!-- بخش خوش‌آمدگویی پس از ورود موفق -->
    <div id="welcome-section">
      <h1>سلام! 👋</h1>
      <p>محمد هستم، به سایت من خوش اومدی. قراره اینجا کلی باهم خوش بگذرونیم، سری به دنیای بازار سرمایه بزنیم و با هم همراه باشیم.</p>
      <a class="btn" href="https://github.com" target="_blank" style="text-align: center;">رفتن به GitHub</a>
    </div>

  </div>

  <script>
    function checkLogin() {
      const userVal = document.getElementById('username').value;
      const passVal = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      
      if (userVal === 'admin' && passVal === 'admin') {
        // مخفی کردن بخش لاگین و نشان دادن بخش خوش‌آمدگویی
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('welcome-section').style.display = 'block';
      } else {
        // نشان دادن خطای قرمز رنگ
        errorDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
